<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>3M - Controle de Inventário</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <script>if (!sessionStorage.getItem('usuarioLogado')) window.location.href = 'index.html';</script>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container">
        <header>
            <div class="brand-wrapper">
                <img src="https://tse4.mm.bing.net/th/id/OIP.FUXUULi5NRfSiATHJrBPewHaD6?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="3M" class="logo-3m">
                <div><h1>Controle de Inventário</h1><div style="font-size: 0.85rem;">Operador: <span id="nomeOperador" style="font-weight: bold;">---</span></div></div>
            </div>
            <button onclick="sessionStorage.clear(); window.location.href='index.html'" class="btn" style="background:#374151;">Logoff</button>
        </header>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('tab-operacao')">📥 Movimentação</button>
            <button class="tab-btn" onclick="switchTab('tab-posicao')">📋 Posição</button>
            <button class="tab-btn" onclick="switchTab('tab-historico')">📜 Histórico</button>
            <button class="tab-btn" id="btnTabCadastro" onclick="switchTab('tab-cadastro')" style="display: none;">👥 Colaboradores</button>
        </div>

        <div id="tab-operacao" class="tab-content active">
            <div class="dashboard-grid">
                <div class="card"><h3>Total</h3><div class="value" id="cardTotal">0</div></div>
                <div class="card critico"><h3>Crítico</h3><div class="value" id="cardCritico">0</div></div>
                <div class="card alerta"><h3>Pedido</h3><div class="value" id="cardComprar">0</div></div>
            </div>
            <div class="main-layout">
                <div class="panel">
                    <h2>📦 Lançamento</h2>
                    <input type="text" id="scannerInput" class="form-control" placeholder="Bipe aqui..." style="border:2px solid var(--primary); margin-bottom:10px;">
                    <form onsubmit="handleManual(event)">
                        <select id="movMaterial" class="form-control" required></select>
                        <select id="movTipo" class="form-control"><option value="ENTRADA">📥 Entrada</option><option value="SAIDA">📤 Saída</option></select>
                        <input type="number" id="movQtd" class="form-control" placeholder="Qtd" required>
                        <button type="submit" class="btn">Confirmar</button>
                    </form>
                </div>
                <div class="panel"><canvas id="chartEstoque"></canvas></div>
            </div>
        </div>

        <div id="tab-posicao" class="tab-content">
            <div class="panel"><h2>📋 Inventário Atual</h2><table><thead><tr><th>Código</th><th>Material</th><th>Estoque</th><th>Min</th><th>Ponto</th><th>Status</th></tr></thead><tbody id="tbodyInventario"></tbody></table></div>
        </div>

        <div id="tab-historico" class="tab-content">
            <div class="panel"><h2>📜 Histórico Recente</h2><table><thead><tr><th>Data/Hora</th><th>Operador</th><th>Item</th><th>Tipo</th><th>Qtd</th></tr></thead><tbody id="tbodyHistorico"></tbody></table></div>
        </div>

        <div id="tab-cadastro" class="tab-content">
            <div class="panel"><h2>👥 Gestão de Usuários</h2><form onsubmit="handleCadastroUsuario(event)"><input type="text" id="cadNome" placeholder="Nome" required><input type="text" id="cadUser" placeholder="Login" required><input type="password" id="cadPass" placeholder="Senha" required><input type="text" id="cadCracha" placeholder="Crachá" required><select id="cadRole"><option value="operador">Operador</option><option value="admin">Admin</option></select><button type="submit" class="btn">Cadastrar</button></form><table><thead><tr><th>Funcionário</th><th>Login</th><th>Crachá</th><th>Nível</th><th>Ação</th></tr></thead><tbody id="tbodyUsuarios"></tbody></table></div>
        </div>
    </div>
    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
