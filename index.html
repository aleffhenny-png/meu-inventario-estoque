<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3M - Acesso ao Sistema</title>
    <!-- O ?v=2 força o navegador a ler o CSS novo sem travar no antigo -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-body">

    <div class="toast-container" id="toastContainer"></div>

    <div class="login-card">
        <!-- Logo Oficial Atualizada -->
        <div class="logo-container">
            <img src="https://tse4.mm.bing.net/th/id/OIP.FUXUULi5NRfSiATHJrBPewHaD6?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="3M Logo" class="logo-3m">
        </div>

        <h2>Controle de Inventário</h2>
        <p>Aproxime seu crachá do leitor ou use a conta manual</p>
        
        <!-- MODO LEITOR ÓPTICO -->
        <div class="scanner-input-wrapper">
            <label style="font-size: 0.75rem; font-weight: bold; color: var(--primary); display: block; margin-bottom: 8px;">🪪 AGUARDANDO BIPAGEM DE CRACHÁ</label>
            <input type="password" id="badgeLoginInput" class="form-control" placeholder="Passe o crachá..." autocomplete="off" style="text-align: center;">
        </div>

        <div style="text-align: center; margin: 15px 0; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; letter-spacing: 0.5px;">— OU ENTRADA MANUAL —</div>

        <!-- FORMULÁRIO MANUAL -->
        <form id="formLogin">
            <div class="form-group">
                <label for="loginUser">Matrícula / Usuário</label>
                <input type="text" id="loginUser" class="form-control" placeholder="Ex: login.usuario" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Senha</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Autenticar no Painel</button>
        </form>
    </div>

    <script>
        const API_URL = 'https://sheetdb.io/api/v1/7d5k8fk5rw4nr';

        function mostrarErro(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast error';
            toast.innerText = `🛑 ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // Login Manual via API
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(API_URL);
                const listaUsuarios = await response.json();
                const conta = listaUsuarios.find(x => x.user === u && x.pass === p);
                
                if (conta) {
                    sessionStorage.setItem('usuarioLogado', conta.nome);
                    sessionStorage.setItem('usuarioRole', conta.role);
                    window.location.href = 'dashboard.html';
                } else {
                    mostrarErro('Usuário ou senha inválidos!');
                }
            } catch (err) {
                mostrarErro('Erro ao conectar com o banco de dados.');
            }
        });

        // Login por Bipagem de Crachá via API
        const badgeInput = document.getElementById('badgeLoginInput');
        badgeInput.focus();
        
        badgeInput.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigoDigitado = this.value.trim();
                try {
                    const response = await fetch(API_URL);
                    const listaUsuarios = await response.json();
                    const conta = listaUsuarios.find(x => x.cracha === codigoDigitado);
                    
                    if (conta) {
                        sessionStorage.setItem('usuarioLogado', conta.nome);
                        sessionStorage.setItem('usuarioRole', conta.role);
                        window.location.href = 'dashboard.html';
                    } else {
                        mostrarErro('Crachá não reconhecido.');
                        this.value = '';
                    }
                } catch (err) {
                    mostrarErro('Erro ao validar o crachá.');
                }
            }
        });

        // Garante foco contínuo no leitor de crachá
        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                badgeInput.focus();
            }
        });
    </script>
</body>
</html>
